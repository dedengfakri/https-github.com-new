
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        run: |
          unzip -q SwiftStockfishAndroid-source.zip -d extracted
          find extracted -name gradlew -type f

      - name: Build APK
        run: |
          ROOT="$(find extracted -name gradlew -type f | head -n 1 | xargs dirname)"
          test -n "$ROOT"
          cd "$ROOT"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SwiftStockfishAndroid-debug
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
